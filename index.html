<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAYPAA X — From Muck to Miracle</title>
    <meta name="description" content="10th Annual Iowa Young People in AA Conference - Iowa City, IA 2026">
    <meta name="theme-color" content="#0a0f0a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #0a0f0a;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #f5f5f0;
            background: radial-gradient(ellipse at 50% 60%, #121f12 0%, #0a0f0a 60%, #050805 100%);
        }

        /* ── Fog particles ── */
        .fog-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .fog {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(45, 74, 45, 0.18) 0%, transparent 70%);
            filter: blur(40px);
            opacity: 0;
            animation: fogDrift linear infinite;
        }

        .fog:nth-child(1) { width: 500px; height: 350px; top: 10%; left: -15%; animation-duration: 18s; animation-delay: 0s; }
        .fog:nth-child(2) { width: 400px; height: 280px; top: 55%; left: -10%; animation-duration: 22s; animation-delay: 2s; }
        .fog:nth-child(3) { width: 600px; height: 400px; top: 30%; left: -20%; animation-duration: 25s; animation-delay: 5s; }
        .fog:nth-child(4) { width: 350px; height: 250px; top: 70%; left: -10%; animation-duration: 20s; animation-delay: 8s; }
        .fog:nth-child(5) { width: 450px; height: 300px; top: 5%;  left: -15%; animation-duration: 24s; animation-delay: 3s; }
        .fog:nth-child(6) { width: 550px; height: 380px; top: 45%; left: -18%; animation-duration: 28s; animation-delay: 6s; }
        .fog:nth-child(7) { width: 320px; height: 220px; top: 80%; left: -8%;  animation-duration: 19s; animation-delay: 10s; }

        @keyframes fogDrift {
            0%   { transform: translateX(0); opacity: 0; }
            10%  { opacity: 0.6; }
            50%  { opacity: 0.8; }
            90%  { opacity: 0.5; }
            100% { transform: translateX(calc(100vw + 200px)); opacity: 0; }
        }

        /* ── Drip accents ── */
        .drip {
            position: fixed;
            top: -10px;
            width: 3px;
            border-radius: 0 0 50% 50%;
            background: linear-gradient(to bottom, rgba(45, 74, 45, 0.6), rgba(124, 179, 66, 0.2), transparent);
            z-index: 2;
            opacity: 0;
        }

        .drip:nth-child(1) { left: 15%; height: 80px; animation: drip 4s 2s ease-in infinite; }
        .drip:nth-child(2) { left: 78%; height: 60px; animation: drip 5s 4.5s ease-in infinite; }
        .drip:nth-child(3) { left: 42%; height: 50px; animation: drip 6s 7s ease-in infinite; }

        @keyframes drip {
            0%   { transform: translateY(-100%) scaleY(0.3); opacity: 0; }
            20%  { transform: translateY(0) scaleY(1); opacity: 0.7; }
            60%  { opacity: 0.5; }
            100% { transform: translateY(120vh) scaleY(1.5); opacity: 0; }
        }

        /* ── Stage ── */
        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 1rem;
        }

        /* ── Glow ring behind logo ── */
        .logo-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glow-ring {
            position: absolute;
            width: 110%;
            height: 110%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 179, 66, 0.15) 0%, rgba(201, 162, 39, 0.08) 40%, transparent 70%);
            filter: blur(30px);
            opacity: 0;
            transform: scale(0.5);
            transition: none;
        }

        /* ── Logo ── */
        .logo {
            display: block;
            width: min(80vw, 420px);
            height: auto;
            opacity: 0;
            filter: blur(15px) saturate(0.3);
            transform: scale(1.12);
            transition: none;
        }

        /* ── Tagline ── */
        .tagline {
            text-align: center;
            opacity: 0;
            transform: translateY(24px);
            transition: none;
        }

        .tagline-main {
            font-family: 'Creepster', cursive;
            font-size: clamp(1.1rem, 4.5vw, 1.8rem);
            color: #c9a227;
            letter-spacing: 0.06em;
            text-shadow: 0 0 20px rgba(201, 162, 39, 0.4), 0 0 60px rgba(201, 162, 39, 0.15);
            line-height: 1.4;
        }

        .tagline-sub {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.7rem, 2.5vw, 0.9rem);
            color: #8a9a8a;
            margin-top: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* ── Loaded state — triggers the whole sequence ── */

        /* Logo emerges: 1s delay, 2.5s duration */
        .loaded .logo {
            transition: opacity 2.5s cubic-bezier(0.25, 0.1, 0.25, 1) 1s,
                        filter 3s cubic-bezier(0.25, 0.1, 0.25, 1) 1s,
                        transform 3s cubic-bezier(0.16, 1, 0.3, 1) 1s;
            opacity: 1;
            filter: blur(0) saturate(1);
            transform: scale(1);
        }

        /* Glow swells in behind logo: 1.5s delay */
        .loaded .glow-ring {
            transition: opacity 3s ease 1.5s, transform 3.5s ease 1.5s;
            opacity: 1;
            transform: scale(1);
            animation: glowPulse 4s ease-in-out 4.5s infinite;
        }

        /* Text appears after logo settles: 4.5s delay */
        .loaded .tagline {
            transition: opacity 1.8s ease 4.5s, transform 1.8s cubic-bezier(0.16, 1, 0.3, 1) 4.5s;
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50%      { opacity: 1;   transform: scale(1.06); }
        }

        /* ── Vignette overlay ── */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(5, 8, 5, 0.7) 100%);
        }

        /* ── Swamp floor ambient glow ── */
        .floor-glow {
            position: fixed;
            bottom: -60px;
            left: 0;
            right: 0;
            height: 200px;
            z-index: 3;
            background: radial-gradient(ellipse at 50% 100%, rgba(45, 74, 45, 0.12) 0%, transparent 70%);
            filter: blur(20px);
            animation: floorPulse 6s ease-in-out infinite;
        }

        @keyframes floorPulse {
            0%, 100% { opacity: 0.5; }
            50%      { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Fog particles -->
    <div class="fog-container">
        <div class="fog"></div>
        <div class="fog"></div>
        <div class="fog"></div>
        <div class="fog"></div>
        <div class="fog"></div>
        <div class="fog"></div>
        <div class="fog"></div>
    </div>

    <!-- Drip accents -->
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>

    <!-- Swamp floor glow -->
    <div class="floor-glow"></div>

    <!-- Vignette -->
    <div class="vignette"></div>

    <!-- Main content -->
    <div class="stage">
        <div class="logo-wrap">
            <div class="glow-ring"></div>
            <picture>
                <source srcset="images/ooze2-mobile.webp" type="image/webp">
                <img src="images/ooze2-mobile.png"
                     alt="IAYPAA X — From Muck to Miracle"
                     class="logo"
                     width="720" height="453">
            </picture>
        </div>
        <div class="tagline">
            <div class="tagline-main">Official Conference Mobile App<br>Coming Soon</div>
            <div class="tagline-sub">Iowa City, Iowa &bull; August 2026</div>
        </div>
    </div>

    <script>
        // Trigger animation sequence after page + fonts load
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
